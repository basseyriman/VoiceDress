<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    VoiceDress — couture mark.
    Hanging fabric folds / soft gown drape. No mic silhouette, no wifi arcs.
  -->
  <!-- Left outer fold — cloth weight toward hem -->
  <path
    d="M15 10.5c0.2 4.5-0.6 10.5-1.4 15.8-.5 3.2-.2 6.2 1.6 8.2"
    stroke="#C9A87C"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Left inner -->
  <path
    d="M19.5 13c0.15 3.8-0.35 8.6-0.9 12.6-.3 2.4-.1 4.6 1.1 6"
    stroke="#C9A87C"
    stroke-width="1.9"
    stroke-linecap="round"
    fill="none"
    opacity="0.72"
  />
  <!-- Center ivory — quiet voice in the cloth -->
  <path
    d="M24 15.5c0.1 3.2-0.15 7.2-0.35 10.8-.12 2-.05 3.8 0.85 4.9"
    stroke="#F5F0E8"
    stroke-width="2.15"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Right inner -->
  <path
    d="M28.5 13c-0.15 3.8 0.35 8.6 0.9 12.6.3 2.4.1 4.6-1.1 6"
    stroke="#C9A87C"
    stroke-width="1.9"
    stroke-linecap="round"
    fill="none"
    opacity="0.72"
  />
  <!-- Right outer fold -->
  <path
    d="M33 10.5c-0.2 4.5 0.6 10.5 1.4 15.8.5 3.2.2 6.2-1.6 8.2"
    stroke="#C9A87C"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />
</svg>
